---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
          - armhf
          - armv7
          - i386
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armhf
            platform: linux/arm/v6
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:${VERSION}-${{ matrix.arch }}"
            TAGS="${TAGS},ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-${{ matrix.arch }}"
          else
            VERSION="dev"
            TAGS="ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-${{ matrix.arch }}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ser2net
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/base:18.0.2
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_DESCRIPTION=Expose serial ports over the network, including RFC2217 support for remote port settings change
            BUILD_NAME=ser2net server
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version=dev" >> "${GITHUB_OUTPUT}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push dev manifest
        if: steps.meta.outputs.is_release == 'false'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-aarch64 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-amd64 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-armhf \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-armv7 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:dev-i386

      - name: Create and push release manifests
        if: steps.meta.outputs.is_release == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest \
            --tag ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:${{ steps.meta.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-aarch64 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-armhf \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-armv7 \
            ghcr.io/${{ github.repository_owner }}/hass-addon-ser2net:latest-i386
